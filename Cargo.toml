[workspace]
resolver = "2"

members = ["rko-sys", "rko-core", "rko-macros", "rko-util", "rko-test-uring"]
exclude = ["samples"]

[workspace.dependencies]
rko-sys = { path = "rko-sys" }
rko-core = { path = "rko-core" }
rko-util = { path = "rko-util" }
rko-macros = { path = "rko-macros" }
bitflags = "2"
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
pinned-init = { version = "0.0.10", default-features = false }
httparse = { version = "1.10", default-features = false }
